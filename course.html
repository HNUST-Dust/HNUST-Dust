<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0c"><meta name="description" content="DUST 战队完整工程培训课程系统">
  <title>DUST ACADEMY · 战队培养计划</title>
  <link rel="stylesheet" href="course.css">
</head>
<body>
  <header class="academy-nav">
    <a class="logo" href="index.html"><img src="assets/dust-logo.png" alt=""><strong>DUST<small>ACADEMY</small></strong></a>
    <nav><a href="index.html#growth">培养计划</a><a href="index.html#recruit">加入战队</a><a href="https://github.com/HNUST-Dust" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
  </header>

  <main>
    <section class="academy-hero">
      <div class="hero-copy"><p class="eyebrow">DUST ENGINEERING CURRICULUM · 2026</p><h1>从好奇开始，<br><em>以交付毕业。</em></h1><p>一套面向机器人战队新成员的工程化学习路径。选择方向、完成任务、记录进度，最终把知识变成能在真实机器人上运行的成果。</p></div>
      <div class="hero-status"><span>YOUR PROGRESS</span><strong id="total-progress">0%</strong><div class="progress"><i id="total-progress-bar"></i></div><small id="progress-copy">还没有完成课程，今天就开始第一节吧。</small></div>
    </section>

    <section class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-title"><span>CURRICULUM</span><strong>课程地图</strong></div>
        <button class="track active" data-track="all"><i>00</i><span>全部课程<small>ALL COURSES</small></span><b id="count-all">24</b></button>
        <button class="track" data-track="common"><i>01</i><span>共同基础<small>FOUNDATION</small></span><b>6</b></button>
        <button class="track" data-track="embedded"><i>02</i><span>嵌入式控制<small>EMBEDDED</small></span><b>6</b></button>
        <button class="track" data-track="vision"><i>03</i><span>视觉与算法<small>VISION & AI</small></span><b>6</b></button>
        <button class="track" data-track="mechanical"><i>04</i><span>机械与硬件<small>MECH & PCB</small></span><b>6</b></button>
        <div class="sidebar-note"><span>培养原则</span><p>理论只占一半。每个阶段都必须通过任务、评审与真实系统验证。</p></div>
      </aside>

      <div class="course-content">
        <div class="toolbar"><div><span id="view-label">全部课程</span><strong id="course-count">24 个学习单元</strong></div><label><span>⌕</span><input id="course-search" type="search" placeholder="搜索课程、技能或工具…"></label></div>
        <div class="phase-tabs" role="tablist"><button class="active" data-phase="all">全部阶段</button><button data-phase="1">01 基础筑基</button><button data-phase="2">02 项目实战</button><button data-phase="3">03 独立担当</button></div>
        <div class="course-grid" id="course-grid"></div>
        <div class="empty" id="empty-state" hidden><strong>没有找到匹配课程</strong><p>试试更短的关键词，或切换课程方向。</p></div>
      </div>
    </section>
  </main>

  <dialog id="lesson-dialog">
    <button class="dialog-close" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="course-data.js"></script><script src="course.js"></script>
</body>
</html>
